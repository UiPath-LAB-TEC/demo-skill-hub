<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">Demo Builder Planner Workflow</title>
  <desc id="desc">A four step workflow: interview, create first draft SPEC.md, tighten the spec by mentioning SPEC.md and TIGHTEN-SPEC-PROMPT.md, then start the build with /goal and CODEX-GOAL-PROMPT.md.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10 z" fill="#343a40"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#212529" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1500" height="650" fill="#ffffff"/>

  <text x="70" y="70" fill="#1e1e1e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Demo Builder Planner Workflow</text>
  <text x="72" y="108" fill="#495057" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">A planning-only path from rough demo idea to implementation-ready Codex handoff.</text>

  <g filter="url(#shadow)">
    <rect x="65" y="165" width="260" height="235" rx="16" fill="#d0ebff" stroke="#1864ab" stroke-width="3"/>
    <rect x="405" y="165" width="260" height="235" rx="16" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="3"/>
    <rect x="745" y="165" width="300" height="235" rx="16" fill="#ffe3e3" stroke="#c92a2a" stroke-width="3"/>
    <rect x="1125" y="165" width="300" height="235" rx="16" fill="#e5dbff" stroke="#5f3dc4" stroke-width="3"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">
    <text x="93" y="205" fill="#0b3558" font-size="22" font-weight="700">1. Interview</text>
    <text x="93" y="248" fill="#0b3558">User gives a customer,</text>
    <text x="93" y="274" fill="#0b3558">use case, or short brief.</text>
    <text x="93" y="322" fill="#0b3558">Planner asks targeted</text>
    <text x="93" y="348" fill="#0b3558">questions and recommends</text>
    <text x="93" y="374" fill="#0b3558">practical defaults.</text>

    <text x="433" y="205" fill="#1b4332" font-size="22" font-weight="700">2. First draft SPEC.md</text>
    <text x="433" y="248" fill="#1b4332">Authoritative build</text>
    <text x="433" y="274" fill="#1b4332">contract covering:</text>
    <text x="433" y="322" fill="#1b4332">inputs, outputs, Flow,</text>
    <text x="433" y="348" fill="#1b4332">agents, APIs, fixtures,</text>
    <text x="433" y="374" fill="#1b4332">and validation.</text>

    <text x="773" y="205" fill="#5c1a1a" font-size="22" font-weight="700">3. Tighten the spec</text>
    <text x="773" y="246" fill="#5c1a1a">Prompt Codex with:</text>
    <text x="773" y="286" fill="#5c1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@SPEC.md</text>
    <text x="773" y="316" fill="#5c1a1a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@TIGHTEN-SPEC-PROMPT.md</text>
    <text x="773" y="360" fill="#5c1a1a">Codex fixes ambiguity</text>
    <text x="773" y="386" fill="#5c1a1a">before build starts.</text>

    <text x="1153" y="205" fill="#2f1b6b" font-size="22" font-weight="700">4. Start the build</text>
    <text x="1153" y="246" fill="#2f1b6b">Prompt Codex with:</text>
    <text x="1153" y="286" fill="#2f1b6b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/goal</text>
    <text x="1153" y="316" fill="#2f1b6b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@SPEC.md</text>
    <text x="1153" y="346" fill="#2f1b6b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@CODEX-GOAL-PROMPT.md</text>
    <text x="1153" y="386" fill="#2f1b6b">Build until done_when is met.</text>
  </g>

  <g stroke="#343a40" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="342" y1="282" x2="386" y2="282"/>
    <line x1="682" y1="282" x2="726" y2="282"/>
    <line x1="1062" y1="282" x2="1106" y2="282"/>
  </g>

  <g>
    <rect x="295" y="475" width="905" height="105" rx="14" fill="#fff9db" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="747" y="514" fill="#343a40" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Planner output stays Markdown-only.</text>
    <text x="747" y="548" fill="#343a40" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Core UiPath skills and Codex handle Flow, agent, mock script payload, validation, and optional Studio Web upload work.</text>
  </g>
</svg>
